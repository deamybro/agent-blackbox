services:
  - type: web
    name: agent-blackbox
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: DATABASE_URL
        value: /var/data/blackbox.db
      - key: NEXT_PUBLIC_APP_URL
        sync: false
    disk:
      name: agent-blackbox-data
      mountPath: /var/data
      sizeGB: 1
